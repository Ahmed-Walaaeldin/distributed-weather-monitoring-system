apiVersion: apps/v1
kind: Deployment
metadata:
  name: rain-processor
  namespace: weather
spec:
  replicas: 1                # scale up to parallelise: partitions are the limit (10)
  selector:
    matchLabels: { app: rain-processor }
  template:
    metadata:
      labels: { app: rain-processor }
    spec:
      containers:
        - name: rain-processor
          image: rain-processor:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: weather-config }
          env:
            - name: STREAMS_STATE_DIR
              value: /tmp/kafka-streams
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "768Mi" }
          volumeMounts:
            - name: streams-state
              mountPath: /tmp/kafka-streams
      volumes:
        - name: streams-state
          emptyDir: {}
