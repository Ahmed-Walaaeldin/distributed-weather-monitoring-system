apiVersion: v1
kind: Namespace
metadata:
  name: weather
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-config
  namespace: weather
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  TOPIC_WEATHER: "weather-readings"
  TOPIC_RAIN: "rain-alerts"
  EMIT_INTERVAL_MS: "1000"
  DROP_RATE: "0.10"
  BATCH_SIZE: "5000"
  FLUSH_INTERVAL_MS: "10000"
  DB_URL: "jdbc:postgresql://postgres:5432/weather"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: weather
type: Opaque
stringData:
  DB_USER: "weather"
  DB_PASSWORD: "weatherpass"
