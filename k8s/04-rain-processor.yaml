apiVersion: apps/v1
kind: Deployment
metadata:
  name: rain-processor
  namespace: weather
spec:
  replicas: 1
  selector:
    matchLabels: { app: rain-processor }
  template:
    metadata:
      labels: { app: rain-processor }
    spec:
      containers:
        - name: rain-processor
          image: rain-processor:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: weather-config }
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "300m", memory: "512Mi" }
