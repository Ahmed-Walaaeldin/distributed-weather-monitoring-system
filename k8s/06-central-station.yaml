apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-station
  namespace: weather
spec:
  replicas: 1                # can be scaled to <= number of partitions (10)
  selector:
    matchLabels: { app: central-station }
  template:
    metadata:
      labels: { app: central-station }
    spec:
      containers:
        - name: central-station
          image: central-station:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: weather-config }
            - secretRef:    { name: db-credentials }    # DB_USER / DB_PASSWORD
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: central-station
  namespace: weather
spec:
  selector: { app: central-station }
  ports:
    - port: 8080
      targetPort: 8080
